# One MinerU endpoint backed by four independent vLLM replicas.
# Requires Docker Compose with !override support (2.24.4+).
services:
  mineru-vlm:
    command:
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --served-model-name
      - mineru4
      - --hf-overrides
      - '{"tie_word_embeddings": ${MINERU_DOCKER_TIE_WORD_EMBEDDINGS:-true}}'
      - --data-parallel-size
      - "4"
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "${MINERU_DOCKER_GPU_MEMORY:-0.45}"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "16"
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]

volumes:
  mineru-models:
    name: ${MINERU_DOCKER_MODEL_VOLUME:-mineru-vlm-models}
    external: ${MINERU_DOCKER_VOLUMES_EXTERNAL:-false}
  mineru-download-cache:
    name: ${MINERU_DOCKER_CACHE_VOLUME:-mineru-vlm-cache}
    external: ${MINERU_DOCKER_VOLUMES_EXTERNAL:-false}
