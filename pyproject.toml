[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "tiangong-ai-unstructure-serve"
version = "0.1.0"
description = "FastAPI service for TianGong AI unstructured document processing."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "linancn" },
]
dependencies = [
    "celery[redis]>=5.6.3",
    "flower>=2.1.0",
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.53.0",
    "gunicorn>=26.2.0",
    "uvicorn-worker>=0.4.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "toml>=0.10.2",
    "openai>=2,<3",
    "google-genai>=2.24.0",
    "mineru>=4.0.2,<4.1",
    "python-docx>=1.2.0",
    "pillow>=12.3.0",
    "loguru>=0.7.3",
    "protobuf>=7.36.2",
    "minio>=7.2.20",
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "pypdfium2>=5",
    "docvortex>=0.4.12,<0.5",
    "kombu[redis]>=5.6",
    "redis>=6.4,<6.5",
    "python-multipart>=0.0.22",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.8",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = '''
(
    /\.venv/
    | ^/(output|input|pdfs|pickle)/
)
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mineru_integration: real input PDFs and prepared MinerU model services"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Preserve the project's previous Ruff defaults across the 0.16 rule expansion.
select = ["E4", "E7", "E9", "F"]
